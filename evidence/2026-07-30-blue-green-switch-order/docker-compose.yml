services:
  blue:
    image: python:3.12-alpine
    command: ["python", "/app/server.py", "--slot", "blue"]
    volumes:
      - ./app/server.py:/app/server.py:ro
    networks: [experiment]

  green:
    image: python:3.12-alpine
    command: ["python", "/app/server.py", "--slot", "green"]
    volumes:
      - ./app/server.py:/app/server.py:ro
    networks: [experiment]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${EXPERIMENT_PORT:-18080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [blue, green]
    networks: [experiment]

networks:
  experiment:
    name: allreva-blue-green-experiment
