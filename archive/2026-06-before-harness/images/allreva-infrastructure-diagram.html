<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Allreva Infrastructure Diagram</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #1f2933;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    .diagram {
      width: 1320px;
      max-width: calc(100vw - 40px);
      padding: 36px;
      background: #ffffff;
    }

    .canvas {
      display: grid;
      grid-template-columns: 470px 1fr;
      gap: 34px;
      align-items: center;
    }

    .external-flow {
      position: relative;
      height: 650px;
    }

    .connectors {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .connectors path {
      fill: none;
      stroke: #aab4c0;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node, .box, .host, .section, .subnet {
      border: 1px solid #d6dde5;
      border-radius: 16px;
      background: #ffffff;
    }

    .node, .box {
      min-height: 82px;
      padding: 16px;
      display: grid;
      place-items: center;
      color: #273444;
      text-align: center;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .node {
      position: absolute;
      width: 150px;
    }

    .github { left: 0; top: 138px; }
    .docker { left: 212px; top: 138px; }
    .users { left: 0; top: 430px; }
    .cloudflare { left: 212px; top: 430px; }
    .home-server { left: 320px; top: 284px; width: 150px; }

    .label {
      display: grid;
      gap: 6px;
      justify-items: center;
      line-height: 1.25;
    }

    .icon {
      width: 34px;
      height: 34px;
      display: block;
      object-fit: contain;
    }

    .icon.local {
      padding: 6px;
      border: 1px solid #d6dde5;
      border-radius: 10px;
      background: #ffffff;
    }

    .node.accent, .box.accent {
      background: #eef6f6;
      border-color: #b8d8d8;
      color: #0f4f4f;
    }

    .host { padding: 24px; min-height: 650px; }

    .host-title, .section-title, .subnet-title {
      margin: 0;
      color: #111827;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .host-title {
      margin-bottom: 20px;
      text-align: left;
      font-size: 22px;
    }

    .host-layout {
      display: grid;
      grid-template-rows: 150px 1fr;
      gap: 22px;
    }

    .section { padding: 18px; background: #fbfcfd; }

    .section-title {
      margin-bottom: 14px;
      text-align: left;
      font-size: 17px;
    }

    .monitoring-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .vpc {
      padding: 20px;
      border: 1px solid #d6dde5;
      border-radius: 18px;
      background: #ffffff;
    }

    .vpc-grid {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 22px;
      align-items: stretch;
      min-height: 390px;
    }

    .subnet { padding: 18px; background: #f8fafc; }
    .subnet.private { background: #fbfcfd; }

    .subnet-title {
      margin-bottom: 18px;
      color: #667385;
      font-size: 15px;
    }

    .public-center, .private-flow {
      height: calc(100% - 38px);
      display: grid;
      align-items: center;
    }

    .private-flow { grid-template-columns: 190px 44px 1fr; }
    .data-stack { display: grid; gap: 18px; }

    .arrow {
      position: relative;
      height: 1px;
      margin: 0 10px;
      background: #aab4c0;
    }

    .arrow::after {
      content: "";
      position: absolute;
      top: -5px;
      right: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid #aab4c0;
    }

    .small {
      margin-top: 6px;
      color: #667385;
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 980px) {
      .diagram { padding: 24px; }
      .canvas, .vpc-grid, .private-flow, .monitoring-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .external-flow { height: 560px; }
      .github { left: 0; top: 0; }
      .docker { left: calc(100% - 150px); top: 0; }
      .users { left: 0; top: 190px; }
      .cloudflare { left: calc(100% - 150px); top: 190px; }
      .home-server { left: calc(50% - 75px); top: 390px; }
      .host { min-height: auto; }
      .host-layout { grid-template-rows: auto; }
      .arrow {
        width: 1px;
        height: 36px;
        margin: 0;
        justify-self: center;
      }
      .arrow::after {
        top: auto;
        bottom: 0;
        left: -5px;
        right: auto;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 9px solid #aab4c0;
        border-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <main class="diagram" aria-label="Allreva infrastructure diagram">
    <section class="canvas">
      <section class="external-flow" aria-label="External traffic and deployment flow">
        <svg class="connectors" viewBox="0 0 470 650" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 Z" fill="#aab4c0"></path>
            </marker>
          </defs>
          <path d="M150 179 L212 179" marker-end="url(#arrowhead)"></path>
          <path d="M150 471 L212 471" marker-end="url(#arrowhead)"></path>
          <path d="M362 179 C410 220 410 270 395 314" marker-end="url(#arrowhead)"></path>
          <path d="M362 471 C410 430 410 380 395 320" marker-end="url(#arrowhead)"></path>
          <path d="M470 325 L508 325" marker-end="url(#arrowhead)"></path>
        </svg>

        <div class="node github"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/githubactions/2088FF" alt="" />GitHub Actions<span class="small">CI/CD</span></span></div>
        <div class="node docker"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/docker/2496ED" alt="" />Docker Hub</span></div>
        <div class="node users"><span class="label"><span class="icon local"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="12" cy="12" r="4"/><circle cx="22" cy="12" r="4"/><path d="M5 27c1-6 5-9 10-8M19 19c5-1 9 2 10 8"/></svg></span>Users</span></div>
        <div class="node cloudflare accent"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/cloudflare/F38020" alt="" />Cloudflare Tunnel</span></div>
        <div class="node home-server accent"><span class="label"><span class="icon local"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="10" y="7" width="14" height="20" rx="2"/><path d="M13 13h8M13 18h8M13 23h5"/></svg></span>Home Server</span></div>
      </section>

      <section class="host">
        <h1 class="host-title">Host</h1>
        <div class="host-layout">
          <section class="section">
            <h2 class="section-title">Monitoring</h2>
            <div class="monitoring-grid">
              <div class="box"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/prometheus/E6522C" alt="" />Prometheus</span></div>
              <div class="box"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/grafana/F46800" alt="" />Loki</span></div>
              <div class="box"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/grafana/F46800" alt="" />Grafana</span></div>
            </div>
          </section>

          <section class="vpc">
            <h2 class="section-title">KVM Bridge Network</h2>
            <div class="vpc-grid">
              <section class="subnet public">
                <h3 class="subnet-title">Public Subnet</h3>
                <div class="public-center">
                  <div class="box accent"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/nginx/009639" alt="" />web-tier<span class="small">Nginx · 80/443</span></span></div>
                </div>
              </section>

              <section class="subnet private">
                <h3 class="subnet-title">Private Subnet</h3>
                <div class="private-flow">
                  <div class="box accent"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/springboot/6DB33F" alt="" />was-tier<span class="small">Spring Boot · 8080</span></span></div>
                  <div class="arrow" aria-hidden="true"></div>
                  <div class="data-stack">
                    <div class="box"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/postgresql/4169E1" alt="" />db-tier<span class="small">PostgreSQL</span></span></div>
                    <div class="box"><span class="label"><img class="icon" src="https://cdn.simpleicons.org/redis/FF4438" alt="" />cache-tier<span class="small">Redis</span></span></div>
                  </div>
                </div>
              </section>
            </div>
          </section>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
