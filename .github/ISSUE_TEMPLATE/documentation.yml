name: 문서 작업
description: 문서 추가, 정리, 구조 변경을 제안합니다.
title: "[DOCS] "
labels: ["📝 docs"]
body:
  - type: markdown
    attributes:
      value: |
        문서에서 무엇을 바꾸고, 왜 필요한지 작성해 주세요.

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 지금 이 변경이 필요한 이유를 적어 주세요.
      placeholder: 예) 현재 배포 문서가 실제 순서를 설명하지 못한다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 변경 범위
      description: 추가·수정·삭제할 문서와 범위를 적어 주세요.
      placeholder: 예) architecture/runtime/delivery.md의 전환 절차를 갱신한다.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 작업이 끝났다고 확인할 수 있는 기준을 적어 주세요.
      placeholder: 예) 문서의 배포 순서가 코드와 일치하고 링크가 유효하다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 관련 자료
      description: 관련 Issue, PR, ADR, 코드 경로가 있으면 적어 주세요. 새 RFC는 만들거나 연결하지 않습니다.
    validations:
      required: false
